
name: Django CI and ECR CD

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - adhilwork-patch-1

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django tests
        env:
          DB_ENGINE: sqlite
        run: python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.sha }} \
            -t techcake-django-app-v3:${{ github.sha }} .

      - name: Prepare Trivy cache
        run: mkdir -p "${{ runner.temp }}/trivy-cache"

      - name: Generate Trivy scan report
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache/" \
            -v "${{ github.workspace }}:/work" \
            aquasec/trivy:0.76.2 \
            image --format json \
            --output /work/trivy-report.json \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            "techcake-django-app-v3:${{ github.sha }}"

      - name: Trivy security gate
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache/" \
            aquasec/trivy:0.76.2 \
            image --format table \
            --severity CRITICAL \
            --exit-code 1 \
            "techcake-django-app-v3:${{ github.sha }}"

      - name: Upload Trivy scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::545931886180:role/GitHubActionsECRRole
          aws-region: ap-south-1

      - name: Login to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_EXISTS=$(aws ecr batch-get-image \
            --repository-name techcake-django-app-v3 \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'images[0].imageId.imageTag' \
            --output text 2>/dev/null || true)

          if [ "$IMAGE_EXISTS" = "$IMAGE_TAG" ]; then
            echo "Image already exists in ECR. Skipping push."
          else
            docker tag techcake-django-app-v3:$IMAGE_TAG \
              $REGISTRY/techcake-django-app-v3:$IMAGE_TAG
            docker push $REGISTRY/techcake-django-app-v3:$IMAGE_TAG
          fi

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::545931886180:role/GitHubActionsECRRole
          aws-region: ap-south-1
          role-duration-seconds: 7200

      - name: Run database migrations once
        shell: bash
        run: |
          set -euo pipefail

          TARGET_GROUP_ARN=$(aws elbv2 describe-target-groups \
            --names TechcakeDjangoV3TG \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)

          INSTANCE_ID=$(aws elbv2 describe-target-health \
            --target-group-arn "$TARGET_GROUP_ARN" \
            --query "TargetHealthDescriptions[?TargetHealth.State=='healthy'] | [0].Target.Id" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "ERROR: No healthy production instance found."
            exit 1
          fi

          echo "Running migration on production instance: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["docker exec django-v3 python manage.py migrate --noinput"]}' \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "ERROR: Database migration failed."
            exit 1
          fi

          echo "Database migration completed successfully."

      - name: Prepare CodeDeploy revision
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_URI="545931886180.dkr.ecr.ap-south-1.amazonaws.com/techcake-django-app-v3:${GITHUB_SHA}"

          printf '%s\n' "$IMAGE_URI" > image_uri.txt
          chmod +x scripts/*.sh

          zip -r deployment.zip \
            appspec.yml \
            image_uri.txt \
            scripts/

      - name: Upload revision to S3
        run: |
          aws s3 cp deployment.zip \
            "s3://tc-0054-django2-files-2026/codedeploy/${GITHUB_SHA}.zip"

      - name: Start CodeDeploy Blue Green deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name TechcakeDjangoV3App \
            --deployment-group-name TechcakeDjangoV3BGGroup \
            --revision "{\"revisionType\":\"S3\",\"s3Location\":{\"bucket\":\"tc-0054-django2-files-2026\",\"key\":\"codedeploy/${GITHUB_SHA}.zip\",\"bundleType\":\"zip\"}}" \
            --description "GitHub Actions deployment ${GITHUB_SHA}" \
            --query 'deploymentId' \
            --output text)

          if [ -z "$DEPLOYMENT_ID" ] || [ "$DEPLOYMENT_ID" = "None" ]; then
            echo "ERROR: CodeDeploy did not return a deployment ID."
            exit 1
          fi

          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Started CodeDeploy deployment: $DEPLOYMENT_ID"

      - name: Wait for CodeDeploy result
        shell: bash
        run: |
          set -euo pipefail

          DEPLOYMENT_ID="${{ steps.deploy.outputs.deployment_id }}"

          echo "Waiting for CodeDeploy deployment: $DEPLOYMENT_ID"

          for attempt in $(seq 1 180); do
            STATUS=$(aws deploy get-deployment \
              --deployment-id "$DEPLOYMENT_ID" \
              --query 'deploymentInfo.status' \
              --output text)

            echo "Attempt $attempt: Deployment status = $STATUS"

            if [ "$STATUS" = "Succeeded" ]; then
              echo "Blue Green deployment completed successfully."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Stopped" ]; then
              echo "ERROR: CodeDeploy deployment $STATUS."
              exit 1
            fi

            sleep 30
          done

          echo "ERROR: Deployment did not complete within 90 minutes."
          exit 1
