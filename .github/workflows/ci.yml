
name: Django CI and ECR CD

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - adhilwork-patch-1

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Django tests
        env:
          DB_ENGINE: sqlite
        run: python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --build-arg APP_VERSION=${{ github.sha }} -t techcake-django-app-v3:${{ github.sha }} .

      - name: Install Trivy
        run: |
          VERSION="0.69.3"
          curl -sfL https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz -o trivy.tar.gz
          tar -xzf trivy.tar.gz trivy
          sudo install trivy /usr/local/bin/trivy
          trivy --version

      - name: Generate Trivy scan report
        run: |
          trivy image --severity HIGH,CRITICAL --format json --output trivy-report.json techcake-django-app-v3:${{ github.sha }} --exit-code 0

      - name: Trivy security gate
        run: |
          trivy image --severity CRITICAL --format table --exit-code 1 techcake-django-app-v3:${{ github.sha }}

      - name: Upload Trivy scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::545931886180:role/GitHubActionsECRRole
          aws-region: ap-south-1

      - name: Login to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag techcake-django-app-v3:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/techcake-django-app-v3:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/techcake-django-app-v3:${{ github.sha }}
