
version: 0.0
os: linux

files:
  - source: image_uri.txt
    destination: /opt/techcake-deploy

hooks:
  BeforeInstall:
    - location: scripts/application_stop.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: scripts/application_start.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 180
      runas: root

  AfterAllowTraffic:
    - location: scripts/intentional_rollback.sh
      timeout: 60
      runas: root
